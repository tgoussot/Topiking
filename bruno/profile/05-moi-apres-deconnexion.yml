info:
  name: 05 Moi après déconnexion - 401
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/api/utilisateurs/moi"
  headers:
    # GARDE-FOU : laisser disabled. Activer cet en-tête fait repasser la requête
    # à 200 — un JWT reste valide après déconnexion, jusqu'à son expiration.
    - name: Cookie
      value: "token={{token_session}}"
      disabled: true

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

  scripts:
    - type: tests
      code: |-
        test("refuse l'accès après déconnexion avec un 401", function () {
          expect(res.getStatus()).to.equal(401);
        });

        test("ne renvoie plus aucune identité", function () {
          const corps = res.getBody();

          expect(corps).to.not.have.property("id");
          expect(corps).to.not.have.property("email");

          const email = bru.getVar("email_session");
          if (email) {
            expect(JSON.stringify(corps)).to.not.contain(email);
          }
        });

        test("répond comme avant toute connexion", function () {
          const reference = bru.getVar("refus_reference");

          expect(reference, "le fichier 01 doit être exécuté avant le 05").to.be.a("string");
          expect(JSON.stringify(res.getBody())).to.equal(reference);
        });
