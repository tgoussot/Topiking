info:
  name: 06 Désactiver le thème créé - 200
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{base_url}}/api/themes/{{id_theme_cree}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Cookie
      value: "token={{token_themes}}"
  body:
    type: json
    data: |-
      {
        "actif": false
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

  scripts:
    - type: before-request
      code: |-
        // GARDE-FOU : le pot à cookies de Bruno mémorise le dernier cookie reçu
        // par domaine et le FUSIONNE dans l'en-tête « Cookie » en lui donnant la
        // PRIORITÉ sur la valeur déclarée ci-dessus. Sans cette purge, le
        // « token_participant » du dernier joueur inscrit supplante le « token »
        // de l'animateur (401) ou le jeton d'un autre joueur (403).
        // Chaque requête incarne une identité précise : son en-tête doit faire foi.
        await bru.cookies.jar().deleteCookies(bru.getEnvVar("base_url"));

    - type: tests
      code: |-
        test("désactive le thème", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().actif).to.equal(false);
        });

        test("le libellé n'a pas été touché", function () {
          // Un PATCH ne modifie que ce qu'on lui donne : le reste survit.
          expect(res.getBody().libelle).to.equal("Thème créé par Bruno");
        });
