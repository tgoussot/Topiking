info:
  name: 07 Lister et compter les participants - 200
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/api/sessions/{{id_session_joueurs}}/participants"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

  scripts:
    - type: tests
      code: |-
        test("liste les deux joueurs, sans authentification", function () {
          // Route ouverte : chacun doit voir qui participe avant le départ.
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().length).to.equal(2);
        });

        test("tous appartiennent à la session demandée", function () {
          res.getBody().forEach(function (joueur) {
            expect(joueur.id_session).to.equal(bru.getVar("id_session_joueurs"));
          });
        });

        test("le compteur donne le même total", async function () {
          const compte = await bru.sendRequest({
            method: "GET",
            url: `${bru.getEnvVar("base_url")}/api/sessions/${bru.getVar("id_session_joueurs")}/participants/nombre`,
          });

          expect(compte.data.nombre).to.equal(2);
        });
