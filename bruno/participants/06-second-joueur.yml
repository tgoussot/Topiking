info:
  name: 06 Un deuxième joueur rejoint - 201
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/api/participants"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "code_acces": {{code_joueurs}},
        "pseudo": "Bob"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

  scripts:
    - type: tests
      code: |-
        if (res.getStatus() === 201) {
          bru.setVar("id_bob", res.getBody().id);

          const entetes = res.getHeaders();
          const cle = Object.keys(entetes).find(
            (nom) => nom.toLowerCase() === "set-cookie"
          );
          const valeur = cle ? entetes[cle] : "";
          const brut = Array.isArray(valeur) ? valeur.join("; ") : String(valeur);
          const trouve = brut.match(/token_participant=([^;]+)/);

          bru.setVar("token_bob", trouve ? trouve[1] : null);
        }

        test("Bob rejoint la partie", function () {
          expect(res.getStatus()).to.equal(201);
        });
