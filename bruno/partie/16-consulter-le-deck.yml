info:
  name: 16 Consulter le deck des cartes - 200
  type: http
  seq: 16

http:
  method: GET
  url: "{{base_url}}/api/cartes"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

  scripts:
    - type: tests
      code: |-
        test("le deck est consultable par tous", function () {
          // Les cartes sont une règle du jeu, pas un contenu d'organisation :
          // chacun doit pouvoir en lire les effets.
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().length).to.be.at.least(1);
        });

        test("chaque carte annonce son type et son effet", function () {
          res.getBody().forEach(function (carte) {
            expect(["bonus", "malus"]).to.contain(carte.type);
            expect(carte.effet).to.be.a("string");
            expect(carte.intensite).to.be.a("number");
          });
        });

        test("le deck contient des bonus et des malus", function () {
          const types = res.getBody().map((carte) => carte.type);

          expect(types).to.contain("bonus");
          expect(types).to.contain("malus");
        });
