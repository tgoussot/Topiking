info:
  name: 05 Alice lit sa question - 200
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/api/participants/{{alice}}/question"
  headers:
    - name: Cookie
      value: "token_participant={{jeton_alice}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

  scripts:
    - type: before-request
      code: |-
        // GARDE-FOU : le pot à cookies de Bruno mémorise le dernier cookie reçu
        // par domaine et le FUSIONNE dans l'en-tête « Cookie » en lui donnant la
        // PRIORITÉ sur la valeur déclarée ci-dessus. Sans cette purge, le
        // « token_participant » du dernier joueur inscrit supplante le « token »
        // de l'animateur (401) ou le jeton d'un autre joueur (403).
        // Chaque requête incarne une identité précise : son en-tête doit faire foi.
        await bru.cookies.jar().deleteCookies(bru.getEnvVar("base_url"));

    - type: tests
      code: |-
        test("le joueur reçoit la question avec son jeton", function () {
          // Le jeton reçu en rejoignant tient lieu d'authentification :
          // il porte l'identifiant du joueur et celui de sa session.
          expect(res.getStatus()).to.equal(200);
        });

        test("sans jeton, la question n'est pas servie", async function () {
          let statut = null;

          try {
            const anonyme = await bru.sendRequest({
              method: "GET",
              url: `${bru.getEnvVar("base_url")}/api/participants/${bru.getVar("alice")}/question`,
            });

            statut = anonyme.status;
          } catch (erreur) {
            statut = erreur.status;
          }

          expect(statut).to.equal(401);
        });

        test("le jeton de Bob ne lit pas la question d'Alice", async function () {
          let statut = null;

          try {
            const usurpation = await bru.sendRequest({
              method: "GET",
              url: `${bru.getEnvVar("base_url")}/api/participants/${bru.getVar("alice")}/question`,
              headers: { Cookie: `token_participant=${bru.getVar("jeton_bob")}` },
            });

            statut = usurpation.status;
          } catch (erreur) {
            statut = erreur.status;
          }

          expect(statut).to.equal(403);
        });

        test("la bonne réponse ne fuit JAMAIS côté joueur", function () {
          const corps = JSON.stringify(res.getBody());

          expect(corps).to.not.contain("index_bonne_reponse");
          expect(corps).to.not.contain("explication");
        });

        test("la question servie est bien celle qui est ouverte", function () {
          expect(res.getBody().id_question).to.equal(bru.getVar("question_courante"));
        });

        test("le timer du joueur lui est propre", function () {
          // Chaque joueur a sa propre durée : ses cartes peuvent l'allonger
          // ou la raccourcir.
          expect(res.getBody().duree_timer_ms).to.be.above(0);
        });
