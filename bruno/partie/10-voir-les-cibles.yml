info:
  name: 10 Consulter les cibles autorisées - 200
  type: http
  seq: 10

http:
  method: GET
  url: "{{base_url}}/api/participants/{{porteur_malus}}/cibles"
  headers:
    - name: Cookie
      value: "token_participant={{jeton_porteur_malus}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

  scripts:
    - type: before-request
      code: |-
        // GARDE-FOU : le pot à cookies de Bruno mémorise le dernier cookie reçu
        // par domaine et le FUSIONNE dans l'en-tête « Cookie » en lui donnant la
        // PRIORITÉ sur la valeur déclarée ci-dessus. Sans cette purge, le
        // « token_participant » du dernier joueur inscrit supplante le « token »
        // de l'animateur (401) ou le jeton d'un autre joueur (403).
        // Chaque requête incarne une identité précise : son en-tête doit faire foi.
        await bru.cookies.jar().deleteCookies(bru.getEnvVar("base_url"));

        // Le joueur protégé est le dernier du classement GÉNÉRAL : c'est celui
        // que le service de ciblage écarte. Il ne coïncide pas toujours avec le
        // dernier de la manche, car les deux classements ne départagent pas les
        // ex æquo de la même façon — au temps cumulé pour la manche, à
        // l'identifiant pour le général, qui ignore le temps. À points égaux,
        // les deux « derniers » diffèrent, d'où un échec intermittent si l'on
        // se fie au classement de la manche.
        const general = await bru.sendRequest({
          method: "GET",
          url: `${bru.getEnvVar("base_url")}/api/sessions/${bru.getVar("session_partie")}/classement`,
        });

        bru.setVar("protege_general", general.data[general.data.length - 1].id_participant);

    - type: tests
      code: |-
        test("les cibles sont listées", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("à trois joueurs, l'attaquant choisit lui-même", function () {
          // Au-delà du seuil de six joueurs, les cibles seraient imposées.
          expect(res.getBody().imposees).to.equal(false);
        });

        test("ni l'attaquant ni le dernier ne figurent parmi les cibles", function () {
          // On ne se vise pas soi-même, et le dernier du classement est
          // protégé : l'enfoncer davantage n'aurait pas d'intérêt.
          const cibles = res.getBody().cibles.map((cible) => cible.id_participant);

          expect(cibles).to.not.contain(bru.getVar("porteur_malus"));
          expect(cibles).to.not.contain(bru.getVar("protege_general"));
        });
