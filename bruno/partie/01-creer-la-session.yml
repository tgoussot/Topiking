info:
  name: 01 L'animateur crée la partie - 201
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/sessions"
  headers:
    - name: Content-Type
      value: application/json
    - name: Cookie
      value: "token={{token_partie}}"
  body:
    type: json
    data: |-
      {
        "id_themes": [{{id_theme_1}}, {{id_theme_2}}, {{id_theme_3}}]
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

  scripts:
    - type: before-request
      code: |-
        // Ce dossier déroule une partie entière, de l'inscription au podium.
        // Tout part d'un animateur neuf, inscrit dans l'organisation qui porte
        // les trois thèmes du seed.
        const email = `partie-${Date.now()}@exemple.fr`;
        const motDePasse = "MonMotDePasse1!";

        const inscription = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("base_url")}/api/utilisateurs`,
          headers: { "Content-Type": "application/json" },
          data: {
            email: email,
            nom: "Animateur",
            mot_de_passe: motDePasse,
            code_invitation: Number(bru.getEnvVar("code_invitation_themes")),
          },
        });

        if (inscription.status !== 201) {
          throw new Error(
            `Inscription impossible (${inscription.status}). Le seed est-il chargé ?`
          );
        }

        const connexion = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("base_url")}/api/utilisateurs/tokens`,
          headers: { "Content-Type": "application/json" },
          data: { email: email, mot_de_passe: motDePasse },
        });

        const entetes = connexion.headers;
        const cle = Object.keys(entetes).find((nom) => nom.toLowerCase() === "set-cookie");
        const brut = Array.isArray(entetes[cle]) ? entetes[cle].join("; ") : String(entetes[cle]);
        const trouve = brut.match(/token=([^;]+)/);

        if (!trouve) {
          throw new Error("Aucun cookie token dans la réponse de connexion.");
        }

        bru.setVar("token_partie", trouve[1]);

    - type: tests
      code: |-
        if (res.getStatus() === 201) {
          bru.setVar("session_partie", res.getBody().id);
          bru.setVar("code_partie", res.getBody().code_acces);
        }

        test("la partie est créée et attend ses joueurs", function () {
          expect(res.getStatus()).to.equal(201);
          expect(res.getBody().statut).to.equal("en_attente");
        });

        test("le tirage des questions est déjà figé", function () {
          // Les trois manches et leurs questions sont tirées dès la création :
          // c'est ce qui garantit que la partie pourra aller jusqu'au bout.
          expect(res.getBody().numero_manche_courante).to.equal(null);
        });
