info:
  name: 09 Piloter la session d'un autre animateur - 403
  type: http
  seq: 9

http:
  method: GET
  url: "{{base_url}}/api/sessions/{{id_session}}"
  headers:
    - name: Cookie
      value: "token={{token_intrus}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

  scripts:
    - type: before-request
      code: |-
        // Un second compte, authentifié mais étranger à la session créée plus haut.
        const email = `intrus-${Date.now()}@exemple.fr`;
        const motDePasse = "MonMotDePasse1!";

        const inscription = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("base_url")}/api/utilisateurs`,
          headers: { "Content-Type": "application/json" },
          data: {
            email: email,
            nom: "Intrus",
            mot_de_passe: motDePasse,
            code_invitation: Number(bru.getEnvVar("code_invitation_themes")),
          },
        });

        if (inscription.status !== 201) {
          throw new Error(`Inscription impossible (${inscription.status}).`);
        }

        const connexion = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("base_url")}/api/utilisateurs/tokens`,
          headers: { "Content-Type": "application/json" },
          data: { email: email, mot_de_passe: motDePasse },
        });

        if (connexion.status !== 200) {
          throw new Error(`Connexion impossible (${connexion.status}).`);
        }

        const entetes = connexion.headers;
        const cle = Object.keys(entetes).find((nom) => nom.toLowerCase() === "set-cookie");
        const brut = Array.isArray(entetes[cle]) ? entetes[cle].join("; ") : String(entetes[cle]);
        const trouve = brut.match(/token=([^;]+)/);

        if (!trouve) {
          throw new Error("Aucun cookie token dans la réponse de connexion.");
        }

        bru.setVar("token_intrus", trouve[1]);

    - type: tests
      code: |-
        test("un compte valide mais étranger reçoit un 403, pas un 401", function () {
          expect(res.getStatus()).to.equal(403);
        });

        test("explique le refus", function () {
          expect(res.getBody()).to.have.property("erreur");
        });

        test("ne divulgue rien de la session", function () {
          expect(res.getBody()).to.not.have.property("code_acces");
          expect(res.getBody()).to.not.have.property("statut");
        });
