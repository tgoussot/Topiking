info:
  name: 08 Démarrer sans participants - 409
  type: http
  seq: 8

http:
  method: POST
  url: "{{base_url}}/api/sessions/{{id_session}}/demarrage"
  headers:
    - name: Cookie
      value: "token={{token_animateur}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"

  scripts:
    - type: before-request
      code: |-
        // GARDE-FOU : le pot à cookies de Bruno mémorise le dernier cookie reçu
        // par domaine et le FUSIONNE dans l'en-tête « Cookie » en lui donnant la
        // PRIORITÉ sur la valeur déclarée ci-dessus. Sans cette purge, le
        // « token_participant » du dernier joueur inscrit supplante le « token »
        // de l'animateur (401) ou le jeton d'un autre joueur (403).
        // Chaque requête incarne une identité précise : son en-tête doit faire foi.
        await bru.cookies.jar().deleteCookies(bru.getEnvVar("base_url"));

    - type: tests
      code: |-
        // Il faut au moins deux joueurs inscrits ; personne n'a encore rejoint.
        test("refuse le démarrage avec un 409", function () {
          expect(res.getStatus()).to.equal(409);
        });

        test("explique qu'il manque des participants", function () {
          expect(res.getBody()).to.have.property("erreur");
          expect(res.getBody().erreur).to.contain("participants");
        });

        test("la session reste en attente", function () {
          expect(res.getBody()).to.not.have.property("statut");
        });
