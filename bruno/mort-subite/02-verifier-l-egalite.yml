info:
  name: 02 Constater l'égalité en tête - 200
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/sessions/{{session_departage}}/mort-subite/egalite"
  headers:
    - name: Cookie
      value: "token={{token_departage}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

  scripts:
    - type: before-request
      code: |-
        // GARDE-FOU : le pot à cookies de Bruno mémorise le dernier cookie reçu
        // par domaine et le FUSIONNE dans l'en-tête « Cookie » en lui donnant la
        // PRIORITÉ sur la valeur déclarée ci-dessus. Sans cette purge, le
        // « token_participant » du dernier joueur inscrit supplante le « token »
        // de l'animateur (401) ou le jeton d'un autre joueur (403).
        // Chaque requête incarne une identité précise : son en-tête doit faire foi.
        await bru.cookies.jar().deleteCookies(bru.getEnvVar("base_url"));

    - type: tests
      code: |-
        test("l'égalité est constatée", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().egalite).to.equal(true);
        });

        test("les trois joueurs sont concernés", function () {
          expect(res.getBody().joueurs.length).to.equal(3);
        });
