info:
  name: 05 Lire la question côté animateur - 200
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/api/questions/{{id_question_creee}}"
  headers:
    - name: Cookie
      value: "token={{token_questions}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

  scripts:
    - type: before-request
      code: |-
        // GARDE-FOU : le pot à cookies de Bruno mémorise le dernier cookie reçu
        // par domaine et le FUSIONNE dans l'en-tête « Cookie » en lui donnant la
        // PRIORITÉ sur la valeur déclarée ci-dessus. Sans cette purge, le
        // « token_participant » du dernier joueur inscrit supplante le « token »
        // de l'animateur (401) ou le jeton d'un autre joueur (403).
        // Chaque requête incarne une identité précise : son en-tête doit faire foi.
        await bru.cookies.jar().deleteCookies(bru.getEnvVar("base_url"));

    - type: tests
      code: |-
        test("renvoie la question", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("la bonne réponse EST visible ici", function () {
          // C'est le back-office : l'animateur écrit ses questions, il doit en
          // voir la solution. Le contraste est avec les routes joueur, où cet
          // index ne sort jamais — voir le dossier « partie ».
          expect(res.getBody().index_bonne_reponse).to.equal(2);
        });

        test("l'explication accompagne la question", function () {
          expect(res.getBody().explication).to.be.a("string");
        });
