info:
  name: 04 Lister les questions du thème - 200
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/api/themes/{{id_theme_questions}}/questions"
  headers:
    - name: Cookie
      value: "token={{token_questions}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

  scripts:
    - type: tests
      code: |-
        test("liste les questions du thème", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.be.an("array");
          expect(res.getBody().length).to.equal(1);
        });

        test("toutes appartiennent au thème demandé", function () {
          const questions = res.getBody();

          questions.forEach(function (question) {
            expect(question.id_theme).to.equal(bru.getVar("id_theme_questions"));
          });
        });
