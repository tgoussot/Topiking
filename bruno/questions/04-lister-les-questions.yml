info:
  name: 04 Lister les questions du thème - 200
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/api/themes/{{id_theme_questions}}/questions"
  headers:
    - name: Cookie
      value: "token={{token_questions}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

  scripts:
    - type: before-request
      code: |-
        // GARDE-FOU : le pot à cookies de Bruno mémorise le dernier cookie reçu
        // par domaine et le FUSIONNE dans l'en-tête « Cookie » en lui donnant la
        // PRIORITÉ sur la valeur déclarée ci-dessus. Sans cette purge, le
        // « token_participant » du dernier joueur inscrit supplante le « token »
        // de l'animateur (401) ou le jeton d'un autre joueur (403).
        // Chaque requête incarne une identité précise : son en-tête doit faire foi.
        await bru.cookies.jar().deleteCookies(bru.getEnvVar("base_url"));

    - type: tests
      code: |-
        test("liste les questions du thème", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.be.an("array");
          expect(res.getBody().length).to.equal(1);
        });

        test("toutes appartiennent au thème demandé", function () {
          const questions = res.getBody();

          questions.forEach(function (question) {
            expect(question.id_theme).to.equal(bru.getVar("id_theme_questions"));
          });
        });
