info:
  name: 06 Lire une question d'une autre organisation - 403
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/api/questions/1"
  headers:
    - name: Cookie
      value: "token={{token_questions}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

  scripts:
    - type: before-request
      code: |-
        // GARDE-FOU : le pot à cookies de Bruno mémorise le dernier cookie reçu
        // par domaine et le FUSIONNE dans l'en-tête « Cookie » en lui donnant la
        // PRIORITÉ sur la valeur déclarée ci-dessus. Sans cette purge, le
        // « token_participant » du dernier joueur inscrit supplante le « token »
        // de l'animateur (401) ou le jeton d'un autre joueur (403).
        // Chaque requête incarne une identité précise : son en-tête doit faire foi.
        await bru.cookies.jar().deleteCookies(bru.getEnvVar("base_url"));

    - type: tests
      code: |-
        test("refuse la question d'une autre organisation", function () {
          // La question 1 du seed appartient au Lycée, l'animateur à l'IUT.
          // La garde remonte par le thème : une question n'a pas
          // d'organisation à elle.
          expect(res.getStatus()).to.equal(403);
        });

        test("la solution ne filtre pas dans le refus", function () {
          const corps = JSON.stringify(res.getBody());

          expect(corps).to.not.contain("index_bonne_reponse");
          expect(corps).to.not.contain("proposition_1");
        });
