name: CI

on:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  tests:
    if: github.ref_name == 'dev'
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref_name == 'dev'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadonnees
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadonnees.outputs.tags }}
          labels: ${{ steps.metadonnees.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  recette:
    name: Déploiement en recette
    runs-on: [self-hosted, topiking-rec]
    needs: image
    if: github.ref_name == 'dev'

    steps:
      - name: Tirer la nouvelle image et relancer la pile
        working-directory: /opt/topiking
        run: |
          docker compose -f compose.prod.yml pull
          docker compose -f compose.prod.yml up -d

      - name: Attendre que l'API réponde
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3301/healthcheck > /dev/null; then
              echo "Recette disponible"
              exit 0
            fi
            sleep 2
          done
          echo "L'API n'a pas répondu après le déploiement"
          docker compose -f /opt/topiking/compose.prod.yml logs api --tail 30
          exit 1

  promotion:
    name: Promotion de l'image en latest
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ajouter le tag latest à l'image déjà validée en recette
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:dev"
          docker buildx imagetools inspect "${IMAGE}:latest" --format '{{json .Manifest.Digest}}'

  production:
    name: Déploiement en production
    runs-on: [self-hosted, topiking-prod]
    needs: promotion
    if: github.ref_name == 'main'
    environment:
      name: production
      url: https://topiking.labo-narra.fr

    steps:
      - name: Tirer l'image promue et relancer la pile
        working-directory: /opt/topiking
        run: |
          docker compose -f compose.prod.yml pull
          docker compose -f compose.prod.yml up -d

      - name: Attendre que l'API réponde
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3301/healthcheck > /dev/null; then
              echo "Production disponible"
              exit 0
            fi
            sleep 2
          done
          echo "L'API n'a pas répondu après le déploiement"
          docker compose -f /opt/topiking/compose.prod.yml logs api --tail 30
          exit 1
