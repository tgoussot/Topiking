name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  jest:
    name: Jest et typage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: supersecret
          POSTGRES_DB: topiking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: supersecret
      DB_NAME: topiking_test
      DB_TEST_NAME: topiking_test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: topiking
      S3_ACCESS_KEY: minio-test
      S3_SECRET_KEY: minio-test-secret
      S3_URL_PUBLIQUE: http://localhost:9000

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Démarrer MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio-test \
            -e MINIO_ROOT_PASSWORD=minio-test-secret \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then break; fi
            if [ "$i" -eq 30 ]; then echo "MinIO n'a pas démarré"; docker logs minio; exit 1; fi
            sleep 2
          done
          docker exec minio mc alias set ci http://localhost:9000 minio-test minio-test-secret
          docker exec minio mc mb --ignore-existing ci/topiking
          docker exec minio mc anonymous set download ci/topiking

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration

  bruno:
    name: Bruno bout en bout
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: supersecret
          POSTGRES_DB: topiking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: supersecret
      DB_NAME: topiking
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PORT: 3301
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: topiking
      S3_ACCESS_KEY: minio-test
      S3_SECRET_KEY: minio-test-secret
      S3_URL_PUBLIQUE: http://localhost:9000

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Démarrer MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio-test \
            -e MINIO_ROOT_PASSWORD=minio-test-secret \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then break; fi
            if [ "$i" -eq 30 ]; then echo "MinIO n'a pas démarré"; docker logs minio; exit 1; fi
            sleep 2
          done
          docker exec minio mc alias set ci http://localhost:9000 minio-test minio-test-secret
          docker exec minio mc mb --ignore-existing ci/topiking
          docker exec minio mc anonymous set download ci/topiking

      - run: npm ci
      - run: npm run build

      - name: Alimenter la base
        run: npx ts-node src/seed.ts

      - name: Démarrer l'API
        run: |
          node dist/index.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3301/healthcheck > /dev/null; then
              echo "API disponible"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "L'API n'a pas répondu dans le délai imparti"
              cat api.log
              exit 1
            fi
            sleep 2
          done

      - name: Jouer la collection
        working-directory: bruno
        run: npx bru run . -r --env local --reporter-junit resultats.xml

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-bruno
          path: bruno/resultats.xml
          if-no-files-found: ignore
