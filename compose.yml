services:
  api:
    build: .
    ports:
      - "${API_PORT_HOTE:-3301}:3301"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-supersecret}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est obligatoire}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT est obligatoire}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET est obligatoire}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY est obligatoire}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY est obligatoire}
      S3_URL_PUBLIQUE: ${S3_URL_PUBLIQUE:?S3_URL_PUBLIQUE est obligatoire}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3301/healthcheck').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecret}
    ports:
      - "${DB_PORT_HOTE:-5433}:5432"
    volumes:
      - donnees_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

volumes:
  donnees_db:
